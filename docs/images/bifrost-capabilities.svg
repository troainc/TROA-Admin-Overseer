<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
<title id="title">Bifrost plugin capability and freshness cards</title>
<desc id="desc">Illustrative phase one Bifrost panel cards, showing capability categories and the distinction between a plugin source sample time and the time Bifrost last checked the plugin. All values are demonstrations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1727"/><stop offset="1" stop-color="#101a2b"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#37d8d2"/><stop offset="1" stop-color="#668bff"/></linearGradient></defs>
<rect width="1180" height="520" rx="24" fill="#080d16"/><rect x="18" y="18" width="1144" height="484" rx="20" fill="url(#bg)" stroke="#28415d"/>
<text x="52" y="62" fill="#67e5ff" font-family="Segoe UI,Arial" font-size="13" font-weight="700" letter-spacing="2">BIFROST · PHASE 1 / ILLUSTRATIVE PREVIEW</text><text x="52" y="100" fill="#edf5ff" font-family="Segoe UI,Arial" font-size="27" font-weight="700">Plugin capabilities &amp; data freshness</text><text x="52" y="128" fill="#9db1c9" font-family="Segoe UI,Arial" font-size="14">Demo content · sample panel layout, not a live server screenshot</text>
<rect x="50" y="158" width="1080" height="286" rx="16" fill="#0b1421" stroke="#273c55"/>
<circle cx="83" cy="197" r="17" fill="#103b3a" stroke="#1f766f"/><text x="78" y="203" fill="#73f0d8" font-family="Segoe UI,Arial" font-size="18" font-weight="700">C</text><text x="114" y="194" fill="#eef5ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">TROA Cleaner+</text><text x="114" y="217" fill="#92a9c3" font-family="Segoe UI,Arial" font-size="12">v1.12.x · Torch reports Enabled</text><rect x="982" y="178" width="116" height="29" rx="14" fill="#113c32" stroke="#1e7257"/><text x="1007" y="197" fill="#8df2c5" font-family="Segoe UI,Arial" font-size="12" font-weight="700">ENABLED</text>
<rect x="78" y="242" width="224" height="64" rx="11" fill="#101e2d" stroke="#2a455f"/><text x="94" y="266" fill="#93aac4" font-family="Segoe UI,Arial" font-size="11">LAST CLEANUP REMOVED</text><text x="94" y="291" fill="#e9f3ff" font-family="Segoe UI,Arial" font-size="21" font-weight="700">12 items</text>
<rect x="316" y="242" width="224" height="64" rx="11" fill="#101e2d" stroke="#2a455f"/><text x="332" y="266" fill="#93aac4" font-family="Segoe UI,Arial" font-size="11">CLEANUP PASSES</text><text x="332" y="291" fill="#e9f3ff" font-family="Segoe UI,Arial" font-size="21" font-weight="700">8 reported</text>
<rect x="78" y="326" width="205" height="31" rx="15" fill="#10281f" stroke="#285840"/><text x="94" y="346" fill="#9ce4b8" font-family="Segoe UI,Arial" font-size="12" font-weight="700">Config · save/reload</text>
<rect x="292" y="326" width="170" height="31" rx="15" fill="#10281f" stroke="#285840"/><text x="308" y="346" fill="#9ce4b8" font-family="Segoe UI,Arial" font-size="12" font-weight="700">Metrics · 6 reported</text>
<rect x="471" y="326" width="188" height="31" rx="15" fill="#10281f" stroke="#285840"/><text x="487" y="346" fill="#9ce4b8" font-family="Segoe UI,Arial" font-size="12" font-weight="700">History · available</text>
<rect x="668" y="326" width="154" height="31" rx="15" fill="#171f30" stroke="#354962"/><text x="684" y="346" fill="#c1d1e3" font-family="Segoe UI,Arial" font-size="12" font-weight="700">Events · none</text>
<rect x="831" y="326" width="267" height="31" rx="15" fill="#10353a" stroke="#267079"/><text x="847" y="346" fill="#9eeff0" font-family="Segoe UI,Arial" font-size="12" font-weight="700">Source sample · 18s ago</text>
<rect x="78" y="380" width="1020" height="42" rx="9" fill="#0c1827" stroke="#23384f"/><rect x="91" y="390" width="5" height="22" rx="2" fill="url(#accent)"/><text x="110" y="406" fill="#a9bdd2" font-family="Segoe UI,Arial" font-size="12">When a plugin has no sample timestamp, Bifrost shows “Checked …” instead of calling the check a new sample.</text>
<text x="52" y="475" fill="#748ca7" font-family="Segoe UI,Arial" font-size="11">DEMONSTRATION VALUES · STATUS COLORS ARE EXAMPLES · DATA IS NEVER IMPLIED WHEN THE SOURCE IS UNAVAILABLE</text>
</svg>
