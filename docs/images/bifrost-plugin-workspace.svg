<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Bifrost plugin workspace preview</title><desc id="desc">Illustrative plugin workspace showing plugin-owned metrics, settings and save controls. All data is demonstration content.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0c1421"/><stop offset="1" stop-color="#08101b"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#16263a"/><stop offset="1" stop-color="#101a29"/></linearGradient></defs>
<rect width="1440" height="900" fill="url(#bg)"/><rect width="248" height="900" fill="#0b1320"/><path d="M247 0v900" stroke="#24374f"/><text x="28" y="42" fill="#78e8ff" font-family="Segoe UI,Arial" font-size="13" font-weight="800" letter-spacing="2">TROA · TORCH</text><text x="28" y="73" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="21" font-weight="800">BIFROST</text><text x="27" y="145" fill="#8093ab" font-family="Segoe UI,Arial" font-size="10" font-weight="800" letter-spacing="1.4">PLUGIN AREAS</text><rect x="14" y="163" width="220" height="42" rx="10" fill="#18334c"/><text x="32" y="189" fill="#dff7ff" font-family="Segoe UI,Arial" font-size="13" font-weight="700">◈  Profiler+</text><text x="32" y="234" fill="#a6b7ca" font-family="Segoe UI,Arial" font-size="13">◈  Cleaner+</text><text x="32" y="274" fill="#a6b7ca" font-family="Segoe UI,Arial" font-size="13">◈  GridVault+</text><text x="32" y="314" fill="#a6b7ca" font-family="Segoe UI,Arial" font-size="13">◈  Econ+</text><text x="28" y="852" fill="#8be8ba" font-family="Segoe UI,Arial" font-size="10" font-weight="800">ADMIN · SAMPLE VIEW</text>
<text x="286" y="55" fill="#78e8ff" font-family="Segoe UI,Arial" font-size="10" font-weight="800" letter-spacing="1.8">PLUGIN WORKSPACE · OWNER API</text><text x="286" y="97" fill="#f0f6ff" font-family="Segoe UI,Arial" font-size="32" font-weight="800">Profiler+</text><text x="286" y="125" fill="#95a9c2" font-family="Segoe UI,Arial" font-size="13">Live data and configuration exposed by the owning plugin.</text><rect x="1213" y="52" width="185" height="32" rx="16" fill="#10291f" stroke="#2d694c"/><circle cx="1231" cy="68" r="4" fill="#63e2a7"/><text x="1243" y="72" fill="#93eabd" font-family="Segoe UI,Arial" font-size="10" font-weight="800">CONNECTED · SAMPLE</text>
<rect x="286" y="158" width="1112" height="206" rx="16" fill="#101a28" stroke="#263b54"/><text x="312" y="193" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="18" font-weight="800">Current measurements</text><text x="312" y="216" fill="#94a9c0" font-family="Segoe UI,Arial" font-size="11">Updated from the plugin’s timestamped status response · sample data</text>
<g font-family="Segoe UI,Arial"><g><rect x="312" y="239" width="244" height="92" rx="12" fill="url(#card)" stroke="#2a405a"/><text x="331" y="266" fill="#9db1c9" font-size="10" font-weight="700">SIMULATION SPEED</text><text x="331" y="307" fill="#f2f7ff" font-size="27" font-weight="800">1.00</text><text x="408" y="305" fill="#77e6b1" font-size="10">sample</text></g><g><rect x="574" y="239" width="244" height="92" rx="12" fill="url(#card)" stroke="#2a405a"/><text x="593" y="266" fill="#9db1c9" font-size="10" font-weight="700">PROCESS CPU</text><text x="593" y="307" fill="#f2f7ff" font-size="27" font-weight="800">38%</text><text x="653" y="305" fill="#9db1c9" font-size="10">demonstration</text></g><g><rect x="836" y="239" width="244" height="92" rx="12" fill="url(#card)" stroke="#2a405a"/><text x="855" y="266" fill="#9db1c9" font-size="10" font-weight="700">ONLINE PLAYERS</text><text x="855" y="307" fill="#f2f7ff" font-size="27" font-weight="800">0</text><text x="883" y="305" fill="#9db1c9" font-size="10">sample only</text></g><g><rect x="1098" y="239" width="276" height="92" rx="12" fill="url(#card)" stroke="#2a405a"/><text x="1117" y="266" fill="#9db1c9" font-size="10" font-weight="700">SAMPLE FRESHNESS</text><text x="1117" y="307" fill="#77e6b1" font-size="22" font-weight="800">30 sec ago</text></g></g>
<rect x="286" y="384" width="568" height="286" rx="16" fill="#101a28" stroke="#263b54"/><text x="312" y="420" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="17" font-weight="800">SimSpeed history</text><text x="312" y="441" fill="#94a9c0" font-family="Segoe UI,Arial" font-size="10">Timestamped source samples · illustrative chart</text><path d="M330 612H820M330 564H820M330 516H820M330 468H820" stroke="#273b53"/><path d="M330 519L395 507L460 513L525 488L590 497L655 477L720 484L790 463" fill="none" stroke="#68dff5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g fill="#68dff5"><circle cx="330" cy="519" r="4"/><circle cx="395" cy="507" r="4"/><circle cx="460" cy="513" r="4"/><circle cx="525" cy="488" r="4"/><circle cx="590" cy="497" r="4"/><circle cx="655" cy="477" r="4"/><circle cx="720" cy="484" r="4"/><circle cx="790" cy="463" r="4"/></g><text x="330" y="638" fill="#8399b3" font-family="Segoe UI,Arial" font-size="9">−60 min</text><text x="770" y="638" fill="#8399b3" font-family="Segoe UI,Arial" font-size="9">now</text>
<rect x="874" y="384" width="524" height="286" rx="16" fill="#101a28" stroke="#263b54"/><text x="900" y="420" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="17" font-weight="800">Configuration</text><text x="900" y="441" fill="#94a9c0" font-family="Segoe UI,Arial" font-size="10">Changes are validated and saved by Profiler+.</text><g font-family="Segoe UI,Arial"><text x="900" y="480" fill="#b7c8db" font-size="11" font-weight="700">Sampling interval</text><rect x="900" y="491" width="468" height="38" rx="8" fill="#08111c" stroke="#38516e"/><text x="915" y="515" fill="#e7f2ff" font-size="12">60 seconds</text><text x="900" y="559" fill="#b7c8db" font-size="11" font-weight="700">Detailed grid limit</text><rect x="900" y="570" width="468" height="38" rx="8" fill="#08111c" stroke="#38516e"/><text x="915" y="594" fill="#e7f2ff" font-size="12">10 grids</text><rect x="1115" y="624" width="118" height="32" rx="8" fill="#17263b" stroke="#385473"/><text x="1134" y="645" fill="#e6f3ff" font-size="10" font-weight="700">Reload</text><rect x="1241" y="624" width="127" height="32" rx="8" fill="#0c6573" stroke="#36d7e4"/><text x="1260" y="645" fill="#edfeff" font-size="10" font-weight="800">Save &amp; apply</text></g>
<rect x="286" y="691" width="1112" height="119" rx="16" fill="#10291f" stroke="#2d694c"/><text x="312" y="728" fill="#8de4b8" font-family="Segoe UI,Arial" font-size="12" font-weight="800">PLUGIN-OWNED CHANGE</text><text x="312" y="753" fill="#d8efe2" font-family="Segoe UI,Arial" font-size="11">Bifrost validates this edit, then calls the plugin’s supported save and reload methods. No arbitrary file write or server restart is performed.</text><text x="312" y="781" fill="#a7c4b4" font-family="Segoe UI,Arial" font-size="10">Source and values shown here are illustrative only.</text><text x="286" y="871" fill="#71869e" font-family="Segoe UI,Arial" font-size="10">ILLUSTRATIVE PANEL PREVIEW · ALL VALUES AND SETTINGS ARE DEMONSTRATION DATA</text>
</svg>
