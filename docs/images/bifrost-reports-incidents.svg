ss="tiny" >Startup evidence</text><rect x="1102" y="584" width="258" height="42" rx="8" class="box"/><rect x="1118" y="597" width="15" height="15" rx="3" fill="#0f8ca1" stroke="#5be1f4"/><text x="1142" y="611" class="tiny" >Grid telemetry</text><rect x="280" y="638" width="258" height="42" rx="8" class="box"/><rect x="296" y="651" width="15" height="15" rx="3" fill="#0f8ca1" stroke="#5be1f4"/><text x="320" y="665" class="tiny" >SimSpeed incidents</text><rect x="554" y="638" width="258" height="42" rx="8" class="box"/><rect x="570" y="651" width="15" height="15" rx="3" fill="#0f8ca1" stroke="#5be1f4"/><text x="594" y="665" class="tiny" >World-save health</text><rect x="828" y="638" width="258" height="42" rx="8" class="box"/><rect x="844" y="651" width="15" height="15" rx="3" fill="#0f8ca1" stroke="#5be1f4"/><text x="868" y="665" class="tiny" >Operations timeline</text><rect x="280" y="715" width="205" height="34" rx="8" class="btn"/><text x="292" y="737" class="tiny" font-weight="700">Generate and download JSON</text><rect x="280" y="770" width="1120" height="82" rx="9" class="box"/><text x="300" y="800" class="small" >Trend charts retain missing periods · no interpolated samples</text><text x="300" y="826" class="muted tiny" >Role-filtered export · excludes private presence text, rosters and secrets</text><text x="258" y="938" class="muted tiny">ILLUSTRATIVE UI · ALL NAMES, IDS, METRICS AND EVENTS ARE SYNTHETIC DEMO DATA · NOT A LIVE CAPTURE</text></svg>