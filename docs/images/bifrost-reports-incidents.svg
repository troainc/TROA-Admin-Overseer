<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">SimSpeed incidents and reports · Bifrost preview</title><desc id="desc">Current Bifrost panel layout with synthetic data. Not a live server capture.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#070c14"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#142336"/><stop offset="1" stop-color="#0e1a29"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e9f2ff}.muted{fill:#91a8c3}.cyan{fill:#6be8ff}.green{fill:#7fe0b1}.yellow{fill:#ffd27d}.red{fill:#ff9ba8}.tiny{font-size:11px}.small{font-size:13px}.label{font-size:11px;font-weight:800;letter-spacing:1.1px;fill:#9fc3e9}.title{font-size:27px;font-weight:800}.sub{font-size:13px}.metric{font-size:21px;font-weight:800}.heading{font-size:16px;font-weight:800}.card{fill:url(#card);stroke:#29435f}.line{stroke:#2b4058}.btn{fill:#182b42;stroke:#385675}.pill{fill:#103326;stroke:#286c50}.box{fill:#0b1522;stroke:#29435f}</style><rect width="1440" height="960" fill="url(#bg)"/><rect width="238" height="960" fill="#0a121e"/><path d="M238 0v960" stroke="#263a52"/><text x="24" y="38" class="cyan tiny" font-weight="800" letter-spacing="2">TROA · TORCH</text><text x="24" y="70" class="title" font-size="23">BIFROST</text><rect x="18" y="88" width="201" height="28" rx="14" class="pill"/><circle cx="35" cy="102" r="4" fill="#69dfaa"/><text x="47" y="106" class="green tiny" font-weight="800">TORCH SESSION · SAMPLE</text><text x="29" y="147" class="muted small" font-weight="500">Overview</text><text x="29" y="190" class="muted small" font-weight="500">Plugin systems</text><text x="29" y="233" class="muted small" font-weight="500">Activity &amp; alerts</text><text x="29" y="276" class="muted small" font-weight="500">Operations timeline</text><text x="29" y="319" class="muted small" font-weight="500">World save health</text><text x="29" y="362" class="muted small" font-weight="500">World overview</text><text x="29" y="405" class="muted small" font-weight="500">Startup diagnosis</text><rect x="12" y="426" width="212" height="36" rx="9" fill="#17334b" stroke="#27506c"/><text x="29" y="448" class="cyan small" font-weight="700">SimSpeed incidents</text><text x="29" y="491" class="muted small" font-weight="500">Reports</text><text x="29" y="534" class="muted small" font-weight="500">GridVault</text><text x="29" y="577" class="muted small" font-weight="500">Core controller</text><rect x="258" y="18" width="1164" height="76" rx="12" class="card"/><text x="278" y="42" class="label">SIM SPEED</text><text x="278" y="72" class="metric green">1.02×</text><text x="464" y="42" class="label">SIM SAMPLE</text><text x="464" y="72" class="metric">5s ago</text><text x="650" y="42" class="label">TORCH</text><text x="650" y="72" class="metric">1.3.1.347</text><text x="836" y="42" class="label">SPACE ENGINEERS</text><text x="836" y="72" class="metric">Steam build 12,345,678</text><text x="1090" y="42" class="label">ACTIVE GRIDS</text><text x="1090" y="72" class="metric">167</text><text x="1260" y="42" class="label">SERVER</text><text x="1260" y="72" class="metric green">Loaded</text><text x="258" y="132" class="cyan tiny" font-weight="800" letter-spacing="1.8">INCIDENT REVIEW · OPERATIONS EXPORT · SAMPLE DATA</text><text x="258" y="167" class="title">SimSpeed incidents and reports</text><text x="258" y="192" class="muted sub">Review bounded incident samples and generate evidence reports with timeline and resource history.</text><rect x="258" y="218" width="1164" height="264" rx="12" class="card"/><text x="280" y="250" class="heading" >SIMSPEED INCIDENTS</text><rect x="280" y="270" width="258" height="68" rx="9" class="card"/><text x="296" y="295" class="label" >INCIDENTS</text><text x="296" y="326" class="metric" >2</text><rect x="558" y="270" width="258" height="68"