ll" font-weight="800">CPU 8</text><text x="654" y="565" class="muted tiny" >Available</text><rect x="820" y="515" width="160" height="72" rx="10" class="box"/><text x="834" y="541" class="small" font-weight="800">CPU 9</text><text x="834" y="565" class="muted tiny" >Available</text><rect x="1000" y="515" width="160" height="72" rx="10" class="box"/><text x="1014" y="541" class="small" font-weight="800">CPU 10</text><text x="1014" y="565" class="muted tiny" >Available</text><rect x="1180" y="515" width="160" height="72" rx="10" class="box"/><text x="1194" y="541" class="small" font-weight="800">CPU 11</text><text x="1194" y="565" class="muted tiny" >Available</text><text x="280" y="648" class="cyan small" font-weight="700">4 logical CPUs selected · hex mask remains available under Advanced</text><rect x="280" y="725" width="145" height="34" rx="8" class="btn"/><text x="292" y="747" class="tiny" font-weight="700">Preview selection</text><rect x="440" y="725" width="150" height="34" rx="8" class="btn"/><text x="452" y="747" class="tiny" font-weight="700">Apply selection</text><rect x="606" y="725" width="205" height="34" rx="8" class="btn"/><text x="618" y="747" class="tiny" font-weight="700">Restore startup affinity</text><rect x="258" y="785" width="1164" height="92" rx="12" class="card"/><text x="280" y="820" class="yellow small" font-weight="700">OWNER ONLY · Changes require a validated preview and live readback.</text><text x="280" y="846" class="muted tiny" >Affinity does not reserve physical cores or increase the game’s single-threaded simulation speed.</text><text x="258" y="938" class="muted tiny">ILLUSTRATIVE UI · ALL NAMES, IDS, METRICS AND EVENTS ARE SYNTHETIC DEMO DATA · NOT A LIVE CAPTURE</text></svg>