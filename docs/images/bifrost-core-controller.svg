<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Bifrost Core Controller preview</title><desc id="desc">Illustrative CPU affinity workspace with separate host logical CPU, Torch allowance, physical core, and controller status details. Demo data only.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0c1421"/><stop offset="1" stop-color="#08101b"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#16263a"/><stop offset="1" stop-color="#101a29"/></linearGradient></defs>
<rect width="1440" height="900" fill="url(#bg)"/><rect width="248" height="900" fill="#0b1320"/><path d="M247 0v900" stroke="#24374f"/><text x="28" y="42" fill="#78e8ff" font-family="Segoe UI,Arial" font-size="13" font-weight="800" letter-spacing="2">TROA · TORCH</text><text x="28" y="73" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="21" font-weight="800">BIFROST</text><rect x="14" y="182" width="220" height="42" rx="10" fill="#18334c"/><text x="32" y="208" fill="#dff7ff" font-family="Segoe UI,Arial" font-size="13" font-weight="700">◈  Core controller</text><text x="32" y="255" fill="#a6b7ca" font-family="Segoe UI,Arial" font-size="13">◈  Overview</text><text x="32" y="295" fill="#a6b7ca" font-family="Segoe UI,Arial" font-size="13">▤  Plugin systems</text><text x="28" y="852" fill="#8be8ba" font-family="Segoe UI,Arial" font-size="10" font-weight="800">OWNER ACCESS · SAMPLE VIEW</text>
<text x="286" y="55" fill="#78e8ff" font-family="Segoe UI,Arial" font-size="10" font-weight="800" letter-spacing="1.8">TORCH PROCESS · CPU AFFINITY</text><text x="286" y="97" fill="#f0f6ff" font-family="Segoe UI,Arial" font-size="32" font-weight="800">Core controller</text><text x="286" y="125" fill="#95a9c2" font-family="Segoe UI,Arial" font-size="13">Choose which allowed logical processors Torch may run on.</text>
<rect x="286" y="150" width="1112" height="70" rx="13" fill="#241c10" stroke="#6a522b"/><text x="308" y="179" fill="#ffd27a" font-family="Segoe UI,Arial" font-size="12" font-weight="800">CONTROLLER OFF · SAMPLE STATE</text><text x="308" y="200" fill="#d7c6a5" font-family="Segoe UI,Arial" font-size="11">Affinity is unchanged. This does not add CPU capacity or parallelize the SE simulation thread.</text>
<g font-family="Segoe UI,Arial"><g><rect x="286" y="240" width="264" height="102" rx="13" fill="url(#card)" stroke="#2a405a"/><text x="306" y="269" fill="#9db1c9" font-size="10" font-weight="700" letter-spacing="1">HOST LOGICAL CPUS</text><text x="306" y="312" fill="#f2f7ff" font-size="29" font-weight="800">16</text><text x="352" y="310" fill="#9db1c9" font-size="10">online sample</text></g><g><rect x="568" y="240" width="264" height="102" rx="13" fill="url(#card)" stroke="#2a405a"/><text x="588" y="269" fill="#9db1c9" font-size="10" font-weight="700" letter-spacing="1">ALLOWED TO TORCH</text><text x="588" y="312" fill="#f2f7ff" font-size="29" font-weight="800">8</text><text x="623" y="310" fill="#9db1c9" font-size="10">process allocation</text></g><g><rect x="850" y="240" width="264" height="102" rx="13" fill="url(#card)" stroke="#2a405a"/><text x="870" y="269" fill="#9db1c9" font-size="10" font-weight="700" letter-spacing="1">PHYSICAL CORES</text><text x="870" y="312" fill="#f2f7ff" font-size="29" font-weight="800">8</text><text x="905" y="310" fill="#9db1c9" font-size="10">topology when available</text></g><g><rect x="1132" y="240" width="266" height="102" rx="13" fill="url(#card)" stroke="#2a405a"/><text x="1152" y="269" fill="#9db1c9" font-size="10" font-weight="700" letter-spacing="1">STARTUP AFFINITY</text><text x="1152" y="312" fill="#f2f7ff" font-size="24" font-weight="800">Restorable</text></g></g>
<rect x="286" y="362" width="1112" height="286" rx="16" fill="#101a28" stroke="#263b54"/><text x="312" y="399" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="18" font-weight="800">Logical CPU map</text><text x="312" y="421" fill="#94a9c0" font-family="Segoe UI,Arial" font-size="11">Logical IDs are not physical core counts. Shaded CPUs are outside Torch’s allowed set.</text>
<g font-family="Segoe UI,Arial" font-size="10" font-weight="700"><g fill="#0d211b" stroke="#2d7353"><rect x="312" y="446" width="116" height="70" rx="10"/><rect x="440" y="446" width="116" height="70" rx="10"/><rect x="568" y="446" width="116" height="70" rx="10"/><rect x="696" y="446" width="116" height="70" rx="10"/><rect x="824" y="446" width="116" height="70" rx="10"/><rect x="952" y="446" width="116" height="70" rx="10"/><rect x="1080" y="446" width="116" height="70" rx="10"/><rect x="1208" y="446" width="164" height="70" rx="10"/></g><g fill="#90e7b8"><text x="327" y="472">CPU 0 · CORE 0</text><text x="455" y="472">CPU 2 · CORE 1</text><text x="583" y="472">CPU 4 · CORE 2</text><text x="711" y="472">CPU 6 · CORE 3</text><text x="839" y="472">CPU 8 · CORE 4</text><text x="967" y="472">CPU 10 · CORE 5</text><text x="1095" y="472">CPU 12 · CORE 6</text><text x="1223" y="472">CPU 14 · CORE 7</text></g><g fill="#283548" stroke="#3b4b61"><rect x="312" y="530" width="116" height="70" rx="10"/><rect x="440" y="530" width="116" height="70" rx="10"/><rect x="568" y="530" width="116" height="70" rx="10"/><rect x="696" y="530" width="116" height="70" rx="10"/><rect x="824" y="530" width="116" height="70" rx="10"/><rect x="952" y="530" width="116" height="70" rx="10"/><rect x="1080" y="530" width="116" height="70" rx="10"/><rect x="1208" y="530" width="164" height="70" rx="10"/></g><g fill="#9cabbc"><text x="327" y="556">CPU 1 · HOST ONLY</text><text x="455" y="556">CPU 3 · HOST ONLY</text><text x="583" y="556">CPU 5 · HOST ONLY</text><text x="711" y="556">CPU 7 · HOST ONLY</text><text x="839" y="556">CPU 9 · HOST ONLY</text><text x="967" y="556">CPU 11 · HOST ONLY</text><text x="1095" y="556">CPU 13 · HOST ONLY</text><text x="1223" y="556">CPU 15 · HOST ONLY</text></g></g>
<rect x="286" y="670" width="1112" height="154" rx="16" fill="#101a28" stroke="#263b54"/><text x="312" y="706" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="16" font-weight="800">Selection and controls</text><text x="312" y="729" fill="#94a9c0" font-family="Segoe UI,Arial" font-size="11">Preview validates the selection. Applying is Owner-only and checks the live CPU allowance.</text><rect x="312" y="755" width="152" height="40" rx="9" fill="#17263b" stroke="#385473"/><text x="330" y="780" fill="#e6f3ff" font-family="Segoe UI,Arial" font-size="11" font-weight="700">Preview selection</text><rect x="476" y="755" width="250" height="40" rx="9" fill="#0c6573" stroke="#36d7e4"/><text x="495" y="780" fill="#edfeff" font-family="Segoe UI,Arial" font-size="11" font-weight="800">Enable controller with selection</text><rect x="738" y="755" width="215" height="40" rx="9" fill="#17263b" stroke="#385473"/><text x="758" y="780" fill="#e6f3ff" font-family="Segoe UI,Arial" font-size="11" font-weight="700">Restore startup affinity</text><text x="286" y="871" fill="#71869e" font-family="Segoe UI,Arial" font-size="10">ILLUSTRATIVE PANEL PREVIEW · ALL CPU VALUES ARE DEMONSTRATION DATA</text>
</svg>
