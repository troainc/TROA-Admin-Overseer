<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">GridVault browser · Bifrost preview</title><desc id="desc">Current Bifrost panel layout with synthetic data. Not a live server capture.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#070c14"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#142336"/><stop offset="1" stop-color="#0e1a29"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e9f2ff}.muted{fill:#91a8c3}.cyan{fill:#6be8ff}.green{fill:#7fe0b1}.yellow{fill:#ffd27d}.red{fill:#ff9ba8}.tiny{font-size:11px}.small{font-size:13px}.label{font-size:11px;font-weight:800;letter-spacing:1.1px;fill:#9fc3e9}.title{font-size:27px;font-weight:800}.sub{font-size:13px}.metric{font-size:21px;font-weight:800}.heading{font-size:16px;font-weight:800}.card{fill:url(#card);stroke:#29435f}.line{stroke:#2b4058}.btn{fill:#182b42;stroke:#385675}.pill{fill:#103326;stroke:#286c50}.box{fill:#0b1522;stroke:#29435f}</style><rect width="1440" height="960" fill="url(#bg)"/><rect width="238" height="960" fill="#0a121e"/><path d="M238 0v960" stroke="#263a52"/><text x="24" y="38" class="cyan tiny" font-weight="800" letter-spacing="2">TROA · TORCH</text><text x="24" y="70" class="title" font-size="23">BIFROST</text><rect x="18" y="88" width="201" height="28" rx="14" class="pill"/><circle cx="35" cy="102" r="4" fill="#69dfaa"/><text x="47" y="106" class="green tiny" font-weight="800">TORCH SESSION · SAMPLE</text><text x="29" y="147" class="muted small" font-weight="500">Overview</text><text x="29" y="190" class="muted small" font-weight="500">Plugin systems</text><text x="29" y="233" class="muted small" font-weight="500">Activity &amp; alerts</text><text x="29" y="276" class="muted small" font-weight="500">Operations timeline</text><text x="29" y="319" class="muted small" font-weight="5